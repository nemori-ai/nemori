services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nemori
      POSTGRES_PASSWORD: nemori
      POSTGRES_DB: nemori
    ports:
      - "5432:5432"
    volumes:
      - nemori_pg_data:/var/lib/postgresql/data
      - ./docker/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nemori"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - nemori_qdrant_data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333; printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; read -r status <&3; [[ $$status == *" 200 "* ]]'
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  nemori_pg_data:
  nemori_qdrant_data:
